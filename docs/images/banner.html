<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Eve banner</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 576px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    color: #17181a;
    background:
      radial-gradient(420px 320px at 170px 230px, rgba(163, 207, 91, 0.22), transparent 70%),
      radial-gradient(600px 400px at 900px 120px, rgba(84, 80, 200, 0.07), transparent 70%),
      #f3f3ef;
  }
  .brand { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); }
  .mark { display: flex; align-items: center; gap: 18px; }
  .mark svg { width: 76px; height: 76px; filter: drop-shadow(0 6px 14px rgba(14, 15, 19, 0.18)); }
  .mark h1 { font-size: 88px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .tagline { margin-top: 14px; font-size: 25px; font-weight: 500; color: #5d5e57; letter-spacing: -0.01em; }
  .chips { margin-top: 22px; display: flex; gap: 8px; }
  .chips span {
    font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 9999px;
    background: #fff; border: 1px solid #e4e4de; color: #5d5e57;
  }
  .chips span.money { background: #a3cf5b; border-color: #a3cf5b; color: #17181a; }

  /* Laptop mockup bleeding off the right edge */
  .device { position: absolute; left: 432px; top: 70px; width: 700px; }
  .screen {
    background: #0e0f13; border-radius: 18px 18px 0 0; padding: 12px 12px 14px;
    box-shadow: 0 30px 60px -20px rgba(14, 15, 19, 0.35), inset 0 0 0 1px #2a2b30;
  }
  .screen img { display: block; width: 100%; border-radius: 4px; }
  .camera { width: 5px; height: 5px; border-radius: 50%; background: #2a2b30; margin: -6px auto 6px; }
  .base {
    height: 16px; margin: 0 -44px; border-radius: 0 0 14px 14px;
    background: linear-gradient(#d8d8d2, #b9b9b0);
    box-shadow: 0 18px 30px -12px rgba(14, 15, 19, 0.3);
    position: relative;
  }
  .base::before {
    content: ""; position: absolute; left: 50%; top: 0; width: 110px; height: 7px;
    transform: translateX(-50%); background: #a9a9a0; border-radius: 0 0 8px 8px;
  }

  /* Callout like the tutor bubble in the reference */
  .callout {
    position: absolute; left: 386px; top: 382px; display: flex; align-items: center; gap: 10px;
    background: #17181a; color: #fff; padding: 10px 14px 10px 10px; border-radius: 14px;
    font-size: 14px; font-weight: 500; line-height: 1.3;
    box-shadow: 0 14px 30px -10px rgba(14, 15, 19, 0.45);
  }
  .callout svg { width: 30px; height: 30px; flex: none; }
  .callout b { color: #a3cf5b; font-weight: 600; }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="229.0688" fill="#0E0F13"/><path d="M194.56 379.73 L406.19 379.73 L512.00 644.27 L300.37 644.27 L279.21 591.36 L437.93 591.36 L416.77 538.45 L258.05 538.45 L236.89 485.55 L395.61 485.55 L374.44 432.64 L215.72 432.64 Z M829.44 379.73 L617.81 379.73 L512.00 644.27 L723.63 644.27 L744.79 591.36 L586.07 591.36 L607.23 538.45 L765.95 538.45 L787.11 485.55 L628.39 485.55 L649.56 432.64 L808.28 432.64 Z" fill="#FFFFFF"/></svg>
      <h1>Eve</h1>
    </div>
    <p class="tagline">Event finances, handled.</p>
    <div class="chips"><span>Travel</span><span>Prizes</span><span class="money">Payouts</span><span>Filings</span></div>
  </div>

  <div class="device">
    <div class="screen"><div class="camera"></div><img src="overview.png" alt=""></div>
    <div class="base"></div>
  </div>

  <div class="callout">
    <svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="229" fill="#a3cf5b"/><path d="M194.56 379.73 L406.19 379.73 L512.00 644.27 L300.37 644.27 L279.21 591.36 L437.93 591.36 L416.77 538.45 L258.05 538.45 L236.89 485.55 L395.61 485.55 L374.44 432.64 L215.72 432.64 Z M829.44 379.73 L617.81 379.73 L512.00 644.27 L723.63 644.27 L744.79 591.36 L586.07 591.36 L607.23 538.45 L765.95 538.45 L787.11 485.55 L628.39 485.55 L649.56 432.64 L808.28 432.64 Z" fill="#0E0F13"/></svg>
    <span><b>$21,018.01</b> ready before closing.<br>Waiting on your controller.</span>
  </div>
</body>
</html>
